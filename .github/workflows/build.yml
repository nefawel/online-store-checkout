name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build OnlineStore.slnx --configuration Release
      - name: Run tests
        run: dotnet run --project tests/OnlineStore.Tests --configuration Release --no-build
